server:
  port: 8082

spring:
  application:
    name: alertas-service
  # Base de datos propia (Database per Service): nada que ver con la de cadena-de-frio-g6
  datasource:
    url: jdbc:postgresql://localhost:5436/alertas
    username: alertas
    password: alertas
  jpa:
    hibernate:
      # El esquema lo crea Flyway (db/migration); Hibernate solo lo valida
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: alertas-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Registro en Eureka (eureka-server, puerto 8761)
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
