spring.application.name=cadena-de-frio-g6

# PostgreSQL en Docker (ver docker-compose.yml en la raiz de cadena-de-frio-g6)
spring.datasource.url=jdbc:postgresql://localhost:5435/cadena_de_frio
spring.datasource.username=cadena
spring.datasource.password=cadena

# El esquema lo crea Flyway (db/migration); Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
