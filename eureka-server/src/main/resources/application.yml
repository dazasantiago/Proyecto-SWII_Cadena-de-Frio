server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    # Con este nombre Eureka se reconoce a sí mismo y no intenta replicarse
    # contra "localhost:8761" como si fuera otro nodo (lección del taller 11).
    hostname: localhost
  client:
    # Es el registro, no un cliente: no se registra ni consulta a nadie.
    register-with-eureka: false
    fetch-registry: false
