spring.application.name=sensores-service
server.port=8083
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
sensores.kafka.topic=sensores.lecturas-fuera-de-rango
sensores.contadores.archivo=${SENSORES_CONTADOR_PATH:./data/lecturas-consecutivas.properties}
