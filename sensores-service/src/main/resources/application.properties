spring.application.name=sensores-service
server.port=8083
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
sensores.kafka.topic=sensores.lecturas-fuera-de-rango
sensores.kafka.timeout-ms=${SENSORES_KAFKA_TIMEOUT_MS:5000}
# Si Kafka no responde, send() se bloquea esperando metadatos hasta max.block.ms (60 s por defecto)
# antes de que empiece a contar el timeout anterior: se limita al mismo plazo.
spring.kafka.producer.properties[max.block.ms]=${SENSORES_KAFKA_TIMEOUT_MS:5000}
sensores.contadores.archivo=${SENSORES_CONTADOR_PATH:./data/lecturas-consecutivas.properties}
# Registro en Eureka (eureka-server, puerto 8761)
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
